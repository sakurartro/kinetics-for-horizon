]

# A neighbour of a chain drive or gearshift changed: its chain and its redstone are read at the end of the tick.
[[injection]]
id = "chain-neighbor"
kind = "HEAD"
target = "horizon_client::game::native_hooks::GameLevel<'_>::native_neighbor_changed"
helper = "chain_neighbor.rs"
