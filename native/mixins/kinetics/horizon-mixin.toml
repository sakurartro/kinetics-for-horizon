# Every tick of a bearing: it asks the contraption machinery to turn what is glued in front of it.
[[injection]]
id = "bearing-tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_block_entity_tick"
helper = "bearing_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "entity", ty = "&mut ModBlockEntity", value = "&mut *entity" },
]

