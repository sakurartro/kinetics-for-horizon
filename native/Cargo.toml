[package]
name = "horizon-mod-kinetics"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Shafts and cogwheels for Horizon: the rotation network logic and its tests."

# The same file the bundle adds to the game as `game::kinetics`.
[lib]
path = "mixins/kinetics/runtime.rs"

# clutch.rs is a module of the bundle like runtime.rs, with its tests in a target of their own.
[[test]]
name = "clutch"
path = "mixins/kinetics/clutch.rs"
# The hand crank's pure rules, also added to the game as `game::kinetics_crank`; its tests are their own target.
[[test]]
name = "crank"
path = "mixins/kinetics/crank.rs"
# The creative motor's pure rules, also added to the game as `game::kinetics_motor`; its tests are their own target.
[[test]]
name = "motor"
path = "mixins/kinetics/motor.rs"
# casing.rs is a module of the bundle like runtime.rs, with its tests in a target of their own.
[[test]]
name = "casing"
path = "mixins/kinetics/casing.rs"
# The wrench's choices: also the module the bundle adds to the game as `game::kinetics_wrench`.
[[test]]
name = "wrench"
path = "mixins/kinetics/wrench_logic.rs"
# The goggles' pure rules, also added to the game as `game::kinetics_goggles`; its tests are their own target.
[[test]]
name = "goggles"
path = "mixins/kinetics/goggles.rs"

# The brackets' rules: also the module the bundle adds to the game as `game::kinetics_bracket`.
[[test]]
name = "bracket"
path = "mixins/kinetics/bracket.rs"

# The girders' pure rules, also added to the game as `game::kinetics_girder`; its tests are their own target.
[[test]]
name = "girder"
path = "mixins/kinetics/girder.rs"

# The cuckoo clocks' rules: also the module the bundle adds to the game as `game::kinetics_clock`.
[[test]]
name = "clock"
path = "mixins/kinetics/clock.rs"

# The rotation speed controller's pure rules, also added to the game as `game::kinetics_speed_controller`.
[[test]]
name = "speed_controller"
path = "mixins/kinetics/speed_controller.rs"

# The flywheel's wheel easing: also the module the bundle adds to the game as `game::kinetics_flywheel`.
[[test]]
name = "flywheel"
path = "mixins/kinetics/flywheel.rs"

# The chain drive and chain gearshift's rules: also the module the bundle adds to the game as `game::kinetics_chain`.
[[test]]
name = "chain"
path = "mixins/kinetics/chain.rs"

# Create's stress rules, also added to the game as `game::kinetics_stress`; its tests are their own target.
[[test]]
name = "stress"
path = "mixins/kinetics/stress.rs"

# The stressometer's pure rules, also added to the game as `game::kinetics_stressometer`; its tests are their own target.
[[test]]
name = "stressometer"
path = "mixins/kinetics/stressometer.rs"
# The speedometer's pure rules, also added to the game as `game::kinetics_speedometer`; its tests are their own target.
[[test]]
name = "speedometer"
path = "mixins/kinetics/speedometer.rs"
# The water wheels' pure rules (flow, score, large wheel body): also the module the bundle adds to the game as `game::kinetics_water_wheel`.
[[test]]
name = "water_wheel"
path = "mixins/kinetics/water_wheel.rs"

# The mechanical drill's pure rules (breaking, placement), also added to the game as `game::kinetics_drill`.
[[test]]
name = "drill"
path = "mixins/kinetics/drill.rs"

# The shaft placement helper's pure rules, also added to the game as `game::kinetics_assist`.
[[test]]
name = "assist"
path = "mixins/kinetics/assist.rs"

# Contraptions' pure rules (assembly, motion), also added to the game as `game::kinetics_contraption`.
[[test]]
name = "contraption"
path = "mixins/kinetics/contraption.rs"
